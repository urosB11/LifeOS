[project]
name = "life-os"
version = "0.1.0"
description = "Life OS — centro de operaciones personal, local y de un solo usuario (MVP 0.1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "tzdata==2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-httpx==0.33.0",
    "httpx==0.27.2",
    "ruff==0.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# LIFEOS_DATA_DIR se fija antes de importar app.* (aislamiento de la base
# personal), por lo que los imports del conftest van después de código.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]