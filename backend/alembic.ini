[alembic]
# path to migration scripts
script_location = migrations

# database URL (overridden by app code via LIFEOS_DATABASE_URL or default local SQLite)
sqlalchemy.url = sqlite:///./lifeos.db

# location of the alembic configuration
prepend_sys_path = .

# version location
version_location = migrations/versions

# logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S