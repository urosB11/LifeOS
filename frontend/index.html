<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life OS</title>
<link rel="stylesheet" href="/assets/css/vars.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar de navegación (Fase 8B) -->
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="sidebar__header">
        <span class="sidebar__brand">Life OS</span>
        <button class="sidebar__close" id="sidebar-close" aria-label="Cerrar menú de navegación">&times;</button>
      </div>
      <nav class="sidebar__nav">
        <a href="#/" class="nav__link" id="nav-home">Home</a>
        <a href="#/projects" class="nav__link" id="nav-projects">Proyectos</a>
        <a href="#/tasks" class="nav__link" id="nav-tasks">Tareas</a>
        <a href="#/notes" class="nav__link" id="nav-notes">Notas</a>
        <a href="#/habits" class="nav__link" id="nav-habits">Hábitos</a>
        <a href="#/settings" class="nav__link" id="nav-settings">Configuración</a>
      </nav>
      <div class="sidebar__footer">
        <div class="header__status" id="status">Conectando&hellip;</div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <!-- Contenido principal -->
    <div class="app-content">
      <header class="header">
        <button class="header__menu-btn" id="menu-btn" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="sidebar">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="5" x2="17" y2="5"/>
            <line x1="3" y1="10" x2="17" y2="10"/>
            <line x1="3" y1="15" x2="17" y2="15"/>
          </svg>
        </button>
        <div class="header__brand">Life OS</div>
        <div class="header__status header__status--mobile" id="status-mobile">Conectando&hellip;</div>
      </header>

      <main class="main">
        <section id="app-view" class="card">
          <p>Cargando&hellip;</p>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
